services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routes
      POSTGRES_USER: routes
      POSTGRES_PASSWORD: routes
      TZ: Europe/Moscow
    volumes:
      - route-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routes -d routes"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: routes
      DB_USER: routes
      DB_PASSWORD: routes
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  route-data:
